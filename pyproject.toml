[project]
name = "csk-dfe"
version = "0.1.0"
description = "Composite Sharding Key para documentos fiscais eletrônicos brasileiros"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",
    "nbclient>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csk_dfe"]
