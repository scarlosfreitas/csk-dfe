services:
  app:
    container_name: ${CONTAINER_NAME}
    # Utiliza a imagem devcontainer local
    image: ${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG}
    pull_policy: missing
    # Utiliza a imagem devcontainer com adições, a linha de cima deve ser comentada
    # build:
      # context: ..
      # dockerfile: .devcontainer/Dockerfile
      # args:
      #   HOST_UID: ${HOST_UID:-1000}
      #   HOST_GID: ${HOST_GID:-1000}
    environment:
      - TZ=America/Sao_Paulo
      # Ambiente virtual do uv fora da árvore do projeto: o devcontainer é
      # descartável e a pasta do projeto é bind mount, então um .venv dentro
      # dela sobreviveria à recriação do container com binários inválidos.
      - UV_PROJECT_ENVIRONMENT=/home/app/.venv-csk-dfe
    restart: unless-stopped
    volumes:
      - ..:${PROJECT_FOLDER}:cached
    command: sleep infinity